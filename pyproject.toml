[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lcms-demo"
version = "0.1.0"
description = "Demo DataJoint pipeline for LC-MS data processing"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "DataJoint", email = "support@datajoint.com"},
]
maintainers = [
    {name = "DataJoint", email = "support@datajoint.com"},
]
keywords = ["datajoint", "lcms", "mass-spectrometry", "pipeline", "demo"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "datajoint[postgres]>=2.3.0",
    "numpy",
    "pandas",
    "scipy",
]

[project.optional-dependencies]
mzml = ["pyteomics"]
plotting = ["matplotlib"]
notebooks = ["jupyter", "ipykernel", "matplotlib", "nbconvert"]

[project.urls]
Homepage = "https://github.com/datajoint/lcms-demo"
Documentation = "https://docs.datajoint.com"
Repository = "https://github.com/datajoint/lcms-demo"
Issues = "https://github.com/datajoint/lcms-demo/issues"
Changelog = "https://github.com/datajoint/lcms-demo/releases"

# PEP 735: Dependency Groups (for development tools)
[dependency-groups]
test = [
    "pytest>=8.0",
    "pytest-cov",
    "testcontainers[postgres]>=4.0",
]
lint = [
    "ruff>=0.4",
]
dev = [
    {include-group = "test"},
    {include-group = "lint"},
]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lcms_demo"]

[tool.ruff]
src = ["src"]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "W",      # pycodestyle warnings
    "UP",     # pyupgrade
    "RUF",    # ruff-specific
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "RUF012", # mutable class attributes (DataJoint uses `contents` for Lookup tables)
]

[tool.ruff.lint.isort]
known-first-party = ["lcms_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
markers = [
    "unit: Fast tests without database access",
    "integration: Tests requiring database access",
]
filterwarnings = [
    "ignore::DeprecationWarning:testcontainers.*",
]

[tool.coverage.run]
source = ["src/lcms_demo"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
