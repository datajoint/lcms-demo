[project]
name = "lcms-demo"
version = "0.1.0"
description = "Demo DataJoint pipeline for LC-MS data processing"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "DataJoint", email = "support@datajoint.com"},
]
keywords = ["datajoint", "lcms", "mass-spectrometry", "pipeline", "demo"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "datajoint>=2.1.0",
    "numpy",
    "pandas",
    "scipy",
]

[project.optional-dependencies]
mzml = ["pyteomics"]  # For parsing real mzML files
plotting = ["matplotlib"]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "testcontainers[mysql]",
]
all = ["lcms-demo[mzml,plotting,dev]"]

[project.urls]
Homepage = "https://github.com/datajoint/lcms-demo"
Documentation = "https://docs.datajoint.com"
Repository = "https://github.com/datajoint/lcms-demo"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lcms_demo"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
markers = [
    "unit: Fast tests without database access",
    "integration: Tests requiring database access",
]
