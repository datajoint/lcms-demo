services:
  mysql:
    image: datajoint/mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: simple
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
